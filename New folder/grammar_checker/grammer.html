<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
     
    body, html {
      height: 100%;
      margin: 0;
    }

    .page-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }

    .content-wrapper {
      display: flex;
      height: calc(100vh - 56px);
      margin-top: 56px;
    }

    .scrollable-content {
      overflow-y: auto;
      flex: 1;
      padding: 10px;
      background-color: #fff;
      transition: padding-right 0.3s ease;
    }

    .fixed-sidebar {
      width: 310px;
      background-color: #fff;
      border-left: 1px solid #ddd;
      position: fixed;
      right: -500px;
      top: 56px;
      bottom: 0;
      transition: right 0.3s ease;
      z-index: 999;
      box-shadow: -2px 0 5px rgba(0,0,0,0.1);
    }

    .fixed-sidebar.show {
      right: 0;
    }

    .inner-sidebar-content {
      height: 100%;
      overflow-y: auto;
      padding: 20px;
    }

    .close-btn {
      background: #dc3545;
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    @media (min-width: 992px) {
      .fixed-sidebar {
        right: 0;
      }
      .close-btn {
        display: none;
      }
      .scrollable-content {
        padding-right: 320px;
      }
    }

    @media (max-width: 991.98px) {
      .fixed-sidebar {
        right: -500px;
      }
      .fixed-sidebar.show {
        right: 0;
      }
    }

     
    #toggleIcon {
      position: fixed;
      left: 0px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1001;
      cursor: pointer;
      display: none;
      background: white;
      padding: 10px;
      border-radius: 10%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    #text-input-area {
      display: block;
    }

    #correction-area {
      display: none;
    }
  </style>
  <!-- <?!= include('JavaScript'); ?> -->
  <script src="JavaScript.js"></script>
  <!-- <script src="Tamil_GrammarChecker_js.js"></script> -->
  </head>
<body>
  
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj-L6rLm7iugvHuUkyOsq4a8unCr5ZPzQ7LpRJ8o11Dv3gs5ihOnLD7H3H5vPCIk23sfbrHmEb9_vLs0zNOCxYJ_jMmhSRv3cij1rDLoTyDcbTrtMgPFATuLPefiksFj-N32TjSQU51xgw7edn9P58NLiQpd0Gir0E37AU6plPGSV5LL7zgNCFtF5fmuhbm/s320/tv.logo.png" alt="Logo" width="200" height="40">
      </a>
    </div>
  </nav>
 
  <i id="toggleIcon" class="fas fa-angle-right" style="display: none;"></i>

  
  <div class="page-container">
    <div class="content-wrapper">
      
      <div class="scrollable-content">
        <h4>Tamil Grammar Editor</h4>
        
        <div class="col-12" id="text-input-area" style="display: block;">
          <form name="vizuthukal">
            <textarea name="tbox" id="tbox" rows="15" style="width: 100%;"></textarea>
            <br>
            <input type="button" class="mt-3 mb-3 btn btn-primary btn-sm" onclick="dome()" value="ஆய்வு செய்">
          </form>
        </div>
        
        <div class="col-12" id="correction-area" style="display: none;">
          <div id="hAnchor" class="mb-3"></div>
          <div style="border-radius: 1em; background-color: #F8F8F8; border: 2px solid #D0D0D0; padding: 6px 6px 6px 20px;" id="myAnchor"></div>
        </div>
      </div>

      
      <div class="fixed-sidebar" id="sidebar">
        <div class="inner-sidebar-content">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="m-0">Result Area</h4>
            <button class="close-btn" onclick="toggleSidebar()">×</button>
          </div>
          <div id="userChoice" style="font-size: small;"></div>
          <div id="pReason" style="font-size: small;" class="mt-2"></div>
          <div id="Reasonyes" style="font-size: small;" class="mt-2"></div>
          <div id="Reasonno" style="font-size: small;" class="mt-2"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    
    function toggleView() {
      const textArea = document.getElementById('text-input-area');
      const correctionArea = document.getElementById('correction-area');
      const toggleIcon = document.getElementById('toggleIcon');
      
      if(textArea.style.display === 'none') {
        textArea.style.display = 'block';
        correctionArea.style.display = 'none';
        toggleIcon.classList.remove('fa-angle-right');
        toggleIcon.classList.remove('fa-angle-left');
        toggleIcon.style.display = 'none';
      } else {
        textArea.style.display = 'none';
        correctionArea.style.display = 'block';
        toggleIcon.classList.remove('fa-angle-left');
        toggleIcon.classList.add('fa-angle-right');
        toggleIcon.style.display = 'block';
      }
    }

    
    document.getElementById('toggleIcon').addEventListener('click', toggleView);
    
    
    
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('show');
    }

    document.addEventListener('click', function(event) {
      const sidebar = document.getElementById('sidebar');
      if (window.innerWidth < 992 && 
          !event.target.closest('#sidebar') && 
          !event.target.closest('.scrollable-content')) {
        sidebar.classList.remove('show');
      }
    });
  </script>

</body></html>
